[pytest]
testpaths = tests
asyncio_mode = auto

# `-m "not graph_funcional"` é a segunda das três camadas que protegem a caixa
# de e-mails de produção (a primeira é a trava de rede em tests/conftest.py, a
# terceira é a guarda de identidade da fixture `graph_funcional`). Com esta
# linha, um `pytest` puro NÃO consegue fazer chamada de rede à Microsoft Graph,
# nem por engano nem por teste novo escrito distraidamente.
#
# Para rodar os testes funcionais, que falam com a caixa TESTER de verdade:
#     pytest -m graph_funcional
addopts = -m "not graph_funcional" --strict-markers

markers =
    graph_funcional: fala com uma caixa REAL da Microsoft Graph (só a TESTER). Desligado por padrão.
